<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App-Development-Info</title>
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --surface-2: #f5f8f7;
    --ink: #1b2a2f;
    --ink-soft: #55676c;
    --ink-faint: #8b9a9e;
    --accent: #2e6e8e;
    --accent-strong: #204d64;
    --accent-soft: #dbe9ef;
    --line: #d6dfe0;
    --serif: Iowan Old Style, "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101718; --surface: #182124; --surface-2: #1c2629;
      --ink: #e7eef0; --ink-soft: #a3b3b6; --ink-faint: #6c7c80;
      --accent: #74b9d6; --accent-strong: #a7d4e8; --accent-soft: #223640;
      --line: #2a3639;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101718; --surface: #182124; --surface-2: #1c2629;
    --ink: #e7eef0; --ink-soft: #a3b3b6; --ink-faint: #6c7c80;
    --accent: #74b9d6; --accent-strong: #a7d4e8; --accent-soft: #223640;
    --line: #2a3639;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.7; }
  .page { max-width: 760px; margin: 0 auto; padding: 56px 24px 96px; }
  .eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 5vw, 38px); line-height: 1.25; margin: 0 0 16px; text-wrap: balance; color: var(--ink); }
  .lede { font-size: 15.5px; color: var(--ink-soft); max-width: 62ch; margin: 0 0 44px; }

  .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 0 0 20px; }
  @media (max-width: 560px) { .hub-grid { grid-template-columns: 1fr; } }
  .hub-card {
    display: block; padding: 26px 24px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; text-decoration: none; color: inherit;
  }
  .hub-card:hover { border-color: var(--accent); }
  .hub-card .icon { font-size: 26px; display: block; margin-bottom: 10px; }
  .hub-card h2 { font-family: var(--serif); font-weight: 600; font-size: 19px; margin: 0 0 8px; color: var(--ink); }
  .hub-card p { font-size: 13px; color: var(--ink-soft); margin: 0; }

  .note { font-size: 13px; color: var(--ink-faint); margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="page">

  <p class="eyebrow">App-Development-Info</p>
  <h1>アプリ開発の基礎知識 学習記録</h1>
  <p class="lede">
    分野ごとに、<strong>学習資料</strong>(学んだ内容そのもの)と<strong>学習記録</strong>
    (自分の理解・正誤の記録・他AIによる確認)をページを分けて管理しています。
  </p>

  <div class="hub-grid">
    <a class="hub-card" href="materials/index.html">
      <span class="icon">📖</span>
      <h2>学習資料</h2>
      <p>各分野で学んだ内容そのもの。図や身近な例を交えた参照用資料。</p>
    </a>
    <a class="hub-card" href="records/index.html">
      <span class="icon">📝</span>
      <h2>学習記録</h2>
      <p>自分の理解・正誤の記録・他AIによる確認。想起チェックのたびに追記。</p>
    </a>
  </div>

  <p class="note">progress-tracker-dashboardのDGT-005(学習記録ページ)に対応。学習資料と学習記録はダッシュボード側でも別タブとして管理する。</p>

</div>
</body>
</html>
